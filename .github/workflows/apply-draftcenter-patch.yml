name: Apply DraftCenter patch

on:
  push:
    paths:
      - 'patch.py'
      - '.github/workflows/apply-draftcenter-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          if [ -f patch.py ]; then
            # Older patch helpers passed replacement text directly to re.subn,
            # which makes JavaScript backslashes look like Python replacement
            # escapes (for example \D). Make replacement strings literal.
            python - <<'PY'
          from pathlib import Path
          p = Path('patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('re.subn(pattern, repl, s, count=1, flags=flags)',
                        're.subn(pattern, lambda _m: repl, s, count=1, flags=flags)')
          p.write_text(s, encoding='utf-8')
          PY
            python patch.py
          fi
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', html)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/draftcenter.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/draftcenter.js
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update DraftCenter"
          git push
