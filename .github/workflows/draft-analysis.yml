name: DraftCenter AI Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'scripts/draft_analysis.py'
      - 'scripts/muse_probe.py'
      - '.github/workflows/draft-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draftcenter-ai-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Probe Muse API safely
        env:
          MUSE_API_KEY: ${{ secrets.MUSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS_BRANCH: analysis
        run: python scripts/muse_probe.py
      - name: Run live draft analysis watcher
        env:
          MUSE_API_KEY: ${{ secrets.MUSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS_BRANCH: analysis
          POLL_SECONDS: '12'
          MAX_SECONDS: '19800'
        run: python scripts/draft_analysis.py
